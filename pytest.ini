[pytest]
# The project root must be importable, or `core`, `tools`, `nodes` and
# `graph` cannot be found. Running `python -m pytest` happens to add the
# current directory to sys.path; the bare `pytest` command does NOT, so
# without this line the suite works one way and fails the other.
pythonpath = .

# Only the suite. The test_*.py scripts in the project root demonstrate
# findings by printing them; collecting those would run them as scripts.
testpaths = tests
addopts = -q --strict-markers
markers =
    a2a: needs run_agents.py running on 127.0.0.1:9001
    slow: runs over the whole corpus
# Finding 18: an unlisted type deserialised from a checkpoint emits a
# UserWarning. Promoting it to an error makes the allowlist a tested claim
# rather than a hopeful one.
filterwarnings =
    error::UserWarning